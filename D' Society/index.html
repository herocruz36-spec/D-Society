<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="D' Society — a modern creative crew landing page." />
  <title>D' Society | Home</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="noise"></div>

    <header class="navbar">
      <a class="brand" href="#home" aria-label="D' Society home">D' SOCIETY</a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="#home" class="nav-link active">Home</a>
        <a href="#" class="nav-link restricted">About</a>
        <a href="#" class="nav-link restricted">Services</a>
        <a href="#" class="nav-link restricted">Work</a>
        <a href="#" class="nav-link restricted">Clients</a>
        <a href="#" class="nav-link restricted">Blog</a>
        <a href="#" class="nav-link restricted">Contact</a>
      </nav>

      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <section class="hero-content">
      <p class="hello">Hello</p>
      <h1>I Am <span class="typed-d">D<span id="dots"></span></span></h1>
      <p class="subtitle">A private crew. A different frequency.</p>

      <div class="ask-wrap">
        <button id="askButton" class="ask-button">
          <span>Ask D'</span>
          <span class="arrow">↗</span>
        </button>
      </div>
    </section>

    <div class="scroll-indicator" aria-hidden="true">
      <span></span>
    </div>
  </main>

  <!-- Restricted-access modal -->
  <div class="modal-backdrop" id="crewModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close popup">×</button>
      <div class="modal-mark">D'</div>
      <p class="modal-kicker">ACCESS DENIED</p>
      <h2 id="modalTitle">Sorry you are not<br>from D' crew</h2>
      <p class="modal-text">This corner of D' Society is reserved for the crew.</p>
      <button class="modal-button" id="modalOkay">Got it</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
